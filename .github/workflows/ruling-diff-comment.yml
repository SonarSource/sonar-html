name: Ruling Diff Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'its/ruling/src/test/resources/expected/**/*.json'
      - '.github/workflows/ruling-diff-comment.yml'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: string
      base-sha:
        description: Base commit SHA
        required: true
        type: string
      head-sha:
        description: Head commit SHA
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ruling-diff-comment:
    runs-on: github-ubuntu-latest-m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: SonarSource/core-languages-tooling-public/ruling-diff-comment@master
        with:
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
          repository: ${{ github.repository }}
          base-sha: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          head-sha: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
          ruling-root: its/ruling/src/test/resources/expected
          sources-root: its/sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
