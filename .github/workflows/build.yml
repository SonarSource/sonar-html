name: Build
on:
  push:
    branches: [master, branch-*, dogfood-*]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC — drives SQ:DEV QA, shadow analyses, and IRIS

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: github-ubuntu-latest-m
    outputs:
      build-number: ${{ steps.build_maven.outputs.BUILD_NUMBER }}
    steps:
      - &checkout
        name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.17
      - &maven_cache
        uses: ./.github/actions/maven-cache
        with:
          save: ${{ github.job == 'build' || github.job == 'build-windows' }}
      - id: build_maven
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          disable-caching: 'true'
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: '-Pcoverage -T1C'

      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build_maven.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

      # Publish the deployed plugin version for the pvf
      - name: Prepare PVF candidate version
        uses: SonarSource/core-languages-tooling-public/prepare-pvf@master
        with:
          build-version: ${{ env.PROJECT_VERSION }}

  bot-tests:
    name: Ruling bot tests
    runs-on: github-ubuntu-latest-s
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/actions/ruling_bot/package-lock.json
      - name: Install coverage tooling
        working-directory: .github/actions/ruling_bot
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test ruling bot and collect subprocess coverage
        working-directory: .github/actions/ruling_bot
        run: npm run coverage
      - name: Save ruling bot coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruling-bot-coverage
          path: coverage/ruling-bot/lcov.info
          retention-days: 7
          if-no-files-found: error

  analysis:
    name: NEXT analysis
    needs: [build, bot-tests]
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: github-ubuntu-latest-m
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - *checkout
      - *mise
      - *maven_cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - name: Download ruling bot coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruling-bot-coverage
          path: coverage/ruling-bot
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          artifactory-reader-role: private-reader
          sonar-platform: next
          maven-args: '-T1C'

  build-windows:
    env: &built_version
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    needs: [build]
    runs-on: github-windows-latest-m
    steps:
      - *checkout
      - *mise
      - *maven_cache
      - name: Build Maven (no deploy)
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          disable-caching: 'true'
          deploy: false
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: '-T1C'

  qa:
    env: *built_version
    if: github.actor != 'dependabot[bot]'
    needs: [build]
    runs-on: github-ubuntu-latest-m
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - &maven_its_cache
        uses: ./.github/actions/maven-cache
        with:
          key-prefix: maven-its
          save: ${{ github.job == 'qa' }}
      - &config_maven
        uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
          disable-caching: 'true'
      - &secrets
        name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN_LICENSES;
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/SonarSource-sonar-html-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - uses: ./.github/actions/orchestrator-cache
      - &download_tested_plugin
        name: Download the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - &install_tested_plugin
        name: Install the tested analyzer
        run: |
          JAR="sonar-html-plugin/target/sonar-html-plugin-${PROJECT_VERSION}.jar"
          test -f "$JAR"
          mvn -N install -DskipTests -B
          mvn org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$JAR" -DgroupId=org.sonarsource.html \
            -DartifactId=sonar-html-plugin -Dversion="$PROJECT_VERSION" -Dpackaging=jar -B
      - name: Run QA tests
        env: &qa_env
          SONARSOURCE_QA: true
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault)['GITHUB_TOKEN_LICENSES'] }}
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          mvn -f its/pom.xml -pl plugin,sonarlint-tests verify -Pqa -Dsonar.runtimeVersion=DEV -Dmaven.test.redirectTestOutputToFile=false -B -e -V

  ruling:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    needs: [build]
    env: *built_version
    runs-on: github-ubuntu-latest-m
    outputs:
      ruling-outcome: ${{ steps.ruling.outcome }}
      ruling-results-saved: ${{ steps.save_ruling.outcome == 'success' }}
      tested-base-sha: ${{ steps.tested_merge.outputs.base_sha }}
      results-artifact-name: ${{ steps.ruling_artifact.outputs.name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: true
          persist-credentials: false
      - name: Capture the tested PR base
        id: tested_merge
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^2')" = "$TESTED_PR_HEAD_SHA"
          echo "base_sha=$(git rev-parse 'HEAD^1')" >> "$GITHUB_OUTPUT"
        env:
          TESTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - *mise
      - uses: ./.github/actions/maven-cache
        with:
          key-prefix: maven-ruling
          save: 'true'
      - *config_maven
      - *secrets
      - uses: ./.github/actions/orchestrator-cache
      - *download_tested_plugin
      - *install_tested_plugin
      - name: Name saved ruling results
        id: ruling_artifact
        # BEGIN GENERATED ARTIFACT NAME
        # Owned by config.mjs / provenance.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
        run: echo "name=actual_html-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
        # END GENERATED ARTIFACT NAME
      - name: Run ruling tests
        id: ruling
        env: *qa_env
        run: mvn -f its/ruling/pom.xml verify -Pqa -Dsonar.runtimeVersion=DEV -Dmaven.test.redirectTestOutputToFile=false -B -e -V
      - name: Show ruling differences
        if: failure()
        run: ./tools/ruling-debug-script.sh
      - name: Prepare ruling results
        id: prepare_ruling
        if: ${{ !cancelled() && steps.ruling.outcome == 'failure' }}
        run: |
          # Prove comparison completed; retain a valid snapshot with zero JSON files.
          test -f its/ruling/target/differences
          mkdir -p its/ruling/target/actual/project
          touch its/ruling/target/actual/ruling-results-complete.txt
      - name: Save generated ruling results
        id: save_ruling
        if: ${{ !cancelled() && steps.prepare_ruling.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.ruling_artifact.outputs.name }}
          # BEGIN GENERATED RESULTS PATH
          # Owned by config.mjs / provenance.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
          path: its/ruling/target/actual/
          # END GENERATED RESULTS PATH
          if-no-files-found: error

  ruling-update:
    name: Update ruling results
    needs: ruling
    if: >-
      !cancelled()
      && github.actor != 'dependabot[bot]'
      && (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch)
      && (needs.ruling.outputs.ruling-outcome == 'success' || needs.ruling.outputs.ruling-results-saved == 'true')
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ruling-bot-pr-{0}', github.event.pull_request.number) || format('ruling-bot-branch-{0}', github.ref_name) }}
      cancel-in-progress: false
      queue: max
    runs-on: github-ubuntu-latest-s
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Download generated ruling results
        if: needs.ruling.outputs.ruling-results-saved == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ruling.outputs.results-artifact-name }}
          # BEGIN GENERATED RESULTS PATH
          # Owned by config.mjs / provenance.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
          path: its/ruling/target/actual/
          # END GENERATED RESULTS PATH
      - name: Update ruling results
        id: ruling_update
        uses: ./.github/actions/ruling_bot
        with:
          github-token: ${{ github.token }}
          # BEGIN GENERATED CALLER PROVENANCE
          # Owned by config.mjs / provenance.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
          pr-number: ${{ github.event.pull_request.number || '' }}
          tested-base-sha: ${{ needs.ruling.outputs.tested-base-sha }}
          ruling-failed: ${{ needs.ruling.outputs.ruling-results-saved == 'true' }}
          is-pull-request: ${{ github.event_name == 'pull_request' }}
          target-ref: ${{ github.head_ref || github.ref_name }}
          tested-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          # END GENERATED CALLER PROVENANCE
          # BEGIN GENERATED CALLER CONFIG
          # Owned by config.mjs / provenance.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
          results-artifact-name: ${{ needs.ruling.outputs.results-artifact-name }}
          # END GENERATED CALLER CONFIG
      # BEGIN GENERATED DISPATCH RECORD
      # Owned by config.mjs / provenance.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
      - name: Record ruling report dispatch
        if: always() && steps.ruling_update.outputs.report-requested == 'true'
        run: echo 'Independent ruling report dispatch succeeded.'
      # END GENERATED DISPATCH RECORD

  analyze-shadows:
    if: github.event_name == 'schedule'
    needs: [build]
    runs-on: github-ubuntu-latest-s
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: sqc-eu
            project-key: SonarSource_sonar-html
          - platform: sqc-us
            project-key: SonarSource_sonar-html
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - uses: ./.github/actions/maven-cache
        with:
          key-prefix: maven-shadows
          save: ${{ matrix.platform == 'sqc-eu' }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          disable-caching: 'true'
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          maven-args: "-Dsonar.projectKey=${{ matrix.project-key }} -Dsonar.organization=sonarsource -Pcoverage-report -Dmaven.install.skip=true -Dmaven.deploy.skip=true"
          sonar-platform: ${{ matrix.platform }}

  iris:
    if: github.event_name == 'schedule'
    needs: [build, analysis, analyze-shadows]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: org.sonarsource.html:html
          primary_platform: Next
          shadow1_project_key: SonarSource_sonar-html
          shadow1_platform: SQC-EU
          shadow2_project_key: SonarSource_sonar-html
          shadow2_platform: SQC-US

  promote:
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.bot-tests.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.qa.result == 'success'
      && needs.ruling.result == 'success'
      && (needs.ruling-update.result == 'success' || needs.ruling-update.result == 'skipped')
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
    needs: [build, bot-tests, analysis, build-windows, qa, ruling, ruling-update]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - *checkout
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.17
          cache_save: false
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    needs: [build, bot-tests, analysis, build-windows, qa, ruling, ruling-update, promote]
    if: >-
      always()
      && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s
    permissions:
      actions: read
      id-token: write # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}

  releasability:
    runs-on: github-ubuntu-latest-s
    name: Releasability
    needs:
      - promote
    permissions:
      id-token: write
      statuses: write
      contents: read
    steps:
      - uses: SonarSource/gh-action_releasability/releasability-status@v3
        if: >-
          github.ref_name == github.event.repository.default_branch ||
          startsWith(github.ref_name, 'branch-') ||
          startsWith(github.ref_name, 'dogfood-')
        with:
          optional_checks: "Jira"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
