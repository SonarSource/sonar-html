name: Build
on:
  push:
    branches: [master, branch-*, dogfood-*]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC — drives SQ:DEV QA, shadow analyses, and IRIS

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: github-ubuntu-latest-m
    outputs:
      build-number: ${{ steps.build_maven.outputs.BUILD_NUMBER }}
    steps:
      - &checkout
        name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.20
      - &maven_cache
        uses: ./.github/actions/maven-cache
        with:
          save: ${{ github.job == 'build' || github.job == 'build-windows' }}
      - id: build_maven
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          disable-caching: 'true'
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: '-Pcoverage -T1C'

      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build_maven.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

      # Publish the deployed plugin version for the pvf
      - name: Prepare PVF candidate version
        uses: SonarSource/core-languages-tooling-public/prepare-pvf@master
        with:
          build-version: ${{ env.PROJECT_VERSION }}

  analysis:
    name: NEXT analysis
    needs: build
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: github-ubuntu-latest-m
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - *checkout
      - *mise
      - *maven_cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          artifactory-reader-role: private-reader
          sonar-platform: next
          maven-args: '-T1C'

  build-windows:
    needs: [build]
    runs-on: github-windows-latest-m
    steps:
      - *checkout
      - *mise
      - *maven_cache
      - name: Build Maven (no deploy)
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          disable-caching: 'true'
          deploy: false
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: '-T1C'

  qa:
    if: github.actor != 'dependabot[bot]'
    needs: [build]
    runs-on: github-ubuntu-latest-m
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - &maven_its_cache
        uses: ./.github/actions/maven-cache
        with:
          key-prefix: maven-its
          save: ${{ github.job == 'qa' }}
      - &config_maven
        uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
          disable-caching: 'true'
      - &secrets
        name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN_LICENSES;
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/SonarSource-sonar-html-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - uses: ./.github/actions/orchestrator-cache
      - name: Run QA tests
        env: &qa_env
          SONARSOURCE_QA: true
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault)['GITHUB_TOKEN_LICENSES'] }}
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          mvn -f its/pom.xml -pl plugin,sonarlint-tests verify -Pqa -Dsonar.runtimeVersion=LATEST_RELEASE -Dmaven.test.redirectTestOutputToFile=false -B -e -V

  qa-dev:
    if: github.event_name == 'schedule'
    needs: [build]
    runs-on: github-ubuntu-latest-m
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - *maven_its_cache
      - *config_maven
      - *secrets
      # No orchestrator cache: SQ:DEV moves daily, the cache key would never hit.
      - name: Run QA tests against SQ:DEV
        env: *qa_env
        run: |
          mvn -f its/pom.xml -pl plugin,sonarlint-tests verify -Pqa -Dsonar.runtimeVersion=DEV -Dmaven.test.redirectTestOutputToFile=false -B -e -V

  ruling:
    if: github.actor != 'dependabot[bot]'
    needs: [build]
    runs-on: github-ubuntu-latest-m
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - *mise
      - uses: ./.github/actions/maven-cache
        with:
          key-prefix: maven-ruling
          save: 'true'
      - *config_maven
      - *secrets
      - uses: ./.github/actions/orchestrator-cache
      - name: Run ruling tests
        id: ruling
        env: *qa_env
        run: |
          mvn -f its/ruling/pom.xml verify -Pqa -Dsonar.runtimeVersion=LATEST_RELEASE -Dmaven.test.redirectTestOutputToFile=false -B -e -V
      - name: Show ruling differences
        if: failure()
        run: ./tools/ruling-debug-script.sh
      - name: Prepare ruling artifact
        if: always() && github.event_name == 'pull_request' && steps.ruling.outcome == 'failure'
        uses: SonarSource/core-languages-tooling-public/prepare-ruling-artifact@master
      - name: Update ruling and comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: SonarSource/core-languages-tooling-public/ruling-update-and-notify@master
        with:
          ruling-failed: ${{ steps.ruling.outcome == 'failure' }}

  analyze-shadows:
    if: github.event_name == 'schedule'
    needs: [build]
    runs-on: github-ubuntu-latest-s
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: sqc-eu
            project-key: SonarSource_sonar-html
          - platform: sqc-us
            project-key: SonarSource_sonar-html
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - uses: ./.github/actions/maven-cache
        with:
          key-prefix: maven-shadows
          save: ${{ matrix.platform == 'sqc-eu' }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          disable-caching: 'true'
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          maven-args: "-Dsonar.projectKey=${{ matrix.project-key }} -Dsonar.organization=sonarsource -Pcoverage-report -Dmaven.install.skip=true -Dmaven.deploy.skip=true"
          sonar-platform: ${{ matrix.platform }}

  iris:
    if: github.event_name == 'schedule'
    needs: [build, analysis, analyze-shadows]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - *mise
      - uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: org.sonarsource.html:html
          primary_platform: Next
          shadow1_project_key: SonarSource_sonar-html
          shadow1_platform: SQC-EU
          shadow2_project_key: SonarSource_sonar-html
          shadow2_platform: SQC-US

  promote:
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.qa.result == 'success'
      && needs.ruling.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
    needs: [build, analysis, build-windows, qa, ruling]
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    steps:
      - *checkout
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.20
          cache_save: false
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    needs: [build, analysis, build-windows, qa, ruling, promote]
    if: >-
      always()
      && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s
    permissions:
      actions: read
      id-token: write # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@master
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}

  releasability:
    runs-on: github-ubuntu-latest-s
    name: Releasability
    needs:
      - promote
    permissions:
      id-token: write
      statuses: write
      contents: read
    steps:
      - uses: SonarSource/gh-action_releasability/releasability-status@v3
        if: >-
          github.ref_name == github.event.repository.default_branch ||
          startsWith(github.ref_name, 'branch-') ||
          startsWith(github.ref_name, 'dogfood-')
        with:
          optional_checks: "Jira"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
