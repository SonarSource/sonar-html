name: Documentation
on: pull_request

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install documentation checker dependencies
        run: python -m pip install --no-cache-dir markdown-it-py==4.0.0 PyYAML==6.0.3
      - name: Test documentation checker
        run: python -B -m unittest discover -s tools -p test_check_docs.py
      - name: Check repository documentation
        run: python -B tools/check_docs.py
      - name: Lint Markdown
        if: ${{ !cancelled() }}
        run: npx --yes markdownlint-cli2@0.18.1
